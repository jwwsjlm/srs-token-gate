# SRS 6 token-auth overlay. Keep this file under the compose directory.
listen              1935;
max_connections      __SRS_MAX_CONNECTIONS__;
srs_log_tank         console;
srs_log_level        __SRS_LOG_LEVEL__;
daemon               off;

http_api {
    enabled          on;
    listen           1985;
    raw_api {
        enabled        on;
        allow_reload   on;
        allow_query    on;
        allow_update   on;
    }
}

http_server {
    enabled          on;
    listen           8080;
    dir              ./objs/nginx/html;
}

rtc_server {
    enabled           on;
    listen            8000;
    candidate         __SRS_CANDIDATE__;
    tcp {
        enabled       on;
        listen        8000;
    }
    protocol          all;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled        on;
        on_publish     http://token-auth:8085/internal/srs/hook?secret=__SRS_HOOK_SECRET__;
        on_play        http://token-auth:8085/internal/srs/hook?secret=__SRS_HOOK_SECRET__;
        on_unpublish   http://token-auth:8085/internal/srs/hook?secret=__SRS_HOOK_SECRET__;
        on_stop        http://token-auth:8085/internal/srs/hook?secret=__SRS_HOOK_SECRET__;
    }

    hls {
        enabled        on;
        hls_ctx        on;
        hls_ts_ctx     on;
    }
    http_remux {
        enabled        on;
        mount          [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled        on;
        rtmp_to_rtc    on;
        rtc_to_rtmp    on;
    }
}
