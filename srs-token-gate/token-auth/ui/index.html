<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SRS Token Gate 登录</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7fa; color: #243042; font: 14px Arial, sans-serif; }
        .login-card { width: min(380px, calc(100% - 32px)); padding: 30px; background: #fff; border: 1px solid #e4e8ee; border-radius: 8px; box-shadow: 0 8px 24px rgba(24, 39, 75, .08); }
        h1 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }
        .subtitle { margin: 0 0 24px; color: #788497; }
        label { display: block; margin: 14px 0 6px; color: #4b5668; }
        input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #ccd3dc; border-radius: 4px; outline: none; }
        input:focus { border-color: #337ab7; box-shadow: 0 0 0 2px rgba(51,122,183,.12); }
        button { width: 100%; height: 40px; margin-top: 20px; border: 0; border-radius: 4px; background: #337ab7; color: #fff; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        .error { min-height: 20px; margin-top: 12px; color: #b94a48; }
    </style>
</head>
<body>
<main class="login-card">
    <h1>SRS Token Gate</h1>
    <p class="subtitle">轻量级 SRS 推拉流鉴权控制台</p>
    <form id="loginForm">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submitButton" type="submit">登录</button>
        <div id="error" class="error" role="alert"></div>
    </form>
</main>
<script>
(function() {
    var target = "/console/ng_index.html#/tokens";
    var form = document.getElementById("loginForm");
    var username = document.getElementById("username");
    var password = document.getElementById("password");
    var button = document.getElementById("submitButton");
    var error = document.getElementById("error");

    fetch("/api/token/me", {credentials:"same-origin"}).then(function(response) {
        if (response.ok) window.location.replace(target);
    }).catch(function() {});

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        error.textContent = "";
        button.disabled = true;
        fetch("/api/token/login", {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({username:username.value, password:password.value})
        }).then(function(response) {
            if (response.ok) {
                password.value = "";
                window.location.replace(target);
                return;
            }
            throw new Error("login failed");
        }).catch(function() {
            error.textContent = "用户名或密码错误";
            password.value = "";
            password.focus();
        }).finally(function() {
            button.disabled = false;
        });
    });
})();
</script>
</body>
</html>
